services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: dating_date_info
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d dating_date_info"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate-info:
    image: migrate/migrate:v4.18.2
    volumes:
      - ./Backend/db/migration/info:/migrations
    command: ["-path", "/migrations", "-database", "postgresql://root:secret@postgres:5432/dating_date_info?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate-chat:
    image: migrate/migrate:v4.18.2
    volumes:
      - ./Backend/db/migration/chat:/migrations
    command: ["-path", "/migrations", "-database", "postgresql://root:secret@postgres:5432/dating_date_chat?sslmode=disable", "up"]
    depends_on:
      migrate-info:
        condition: service_completed_successfully

  api:
    build:
      context: ./Backend
    ports:
      - "19090:9090"
      - "8080:8080"
    environment:
      DB_SOURCE_INFO: postgresql://root:secret@postgres:5432/dating_date_info?sslmode=disable
      DB_SOURCE_CHAT: postgresql://root:secret@postgres:5432/dating_date_chat?sslmode=disable
    env_file:
      - ./Backend/app.env
    depends_on:
      migrate-chat:
        condition: service_completed_successfully

volumes:
  pgdata:
